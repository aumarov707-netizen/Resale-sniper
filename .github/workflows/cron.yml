name: Amazon Resale Sniper - refresh deals

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (UTC), off the top of the hour to dodge queue spikes
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write            # needed to push data.json back to the repo

concurrency:
  group: amazon-resale-sniper-refresh
  cancel-in-progress: false  # never kill a run mid-commit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEYS: ${{ secrets.CREATORS_CREDENTIAL_ID != '' && secrets.CREATORS_CREDENTIAL_SECRET != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Skip until Creators API keys are added
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::No Creators API keys yet - skipping. Add CREATORS_CREDENTIAL_ID and CREATORS_CREDENTIAL_SECRET secrets to enable."

      - name: Fetch Amazon Resale deals
        if: env.HAS_KEYS == 'true'
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_CREDENTIAL_VERSION: ${{ vars.CREATORS_CREDENTIAL_VERSION || '3.1' }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE || 'www.amazon.com' }}
          MIN_DISCOUNT_PCT: ${{ vars.MIN_DISCOUNT_PCT || '35' }}
          SEARCH_KEYWORDS: ${{ vars.SEARCH_KEYWORDS }}
          RESALE_MERCHANT_IDS: ${{ vars.RESALE_MERCHANT_IDS }}
        run: python parser.py

      - name: Commit and push updated data
        if: env.HAS_KEYS == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json price_history.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): refresh deals $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push data.json after 3 attempts"
          exit 1
