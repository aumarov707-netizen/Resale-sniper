<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Resale Sniper</title>
  <meta name="description" content="Amazon Resale price drops of 35% or more, refreshed every 4 hours.">
  <meta name="theme-color" content="#F3EEE6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="data.json" as="fetch" crossorigin>
  <style>
    html { background: #F3EEE6; color-scheme: light; }
    body { margin: 0; min-height: 100vh; padding: clamp(12px, 3vw, 40px) clamp(12px, 3vw, 40px); }
    main { max-width: 1280px; margin: 0 auto; }
    amazon-sniper:not(:defined) { display: block; min-height: 70vh; background: #FBF8F3; border-radius: 20px; }
  </style>
  <script src="plugin.js" defer></script>
</head>
<body>
  <main>
    <amazon-sniper src="data.json" limit="6"></amazon-sniper>
  </main>
</body>
</html>
